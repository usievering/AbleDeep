name: Build AbleDeep

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Findet das Projekt, egal ob die Dateien direkt oder im Ordner "AbleDeep" hochgeladen wurden
      - name: Find project
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            echo "PROJ=$(dirname "$(find . -maxdepth 3 -name CMakeLists.txt | head -1)")" >> "$GITHUB_ENV"
          fi

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -S "$PROJ" -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -S "$PROJ" -B build
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p out
          cp -R build/AbleDeep_artefacts/Release/VST3/AbleDeep.vst3 out/
          cp "$PROJ/README.md" out/

      # macOS: signieren und als ZIP verpacken, damit die Programmdatei im Plugin startfähig bleibt
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          A=build/AbleDeep_artefacts/Release
          codesign --force --deep -s - "$A/VST3/AbleDeep.vst3"
          codesign --force --deep -s - "$A/AU/AbleDeep.component"
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$A/VST3/AbleDeep.vst3" out/AbleDeep-VST3.zip
          ditto -c -k --sequesterRsrc --keepParent "$A/AU/AbleDeep.component" out/AbleDeep-AU.zip
          cp "$PROJ/README.md" out/

      - uses: actions/upload-artifact@v4
        with:
          name: AbleDeep-${{ matrix.name }}
          path: out
